
name: CampusGo CI-CD

on:
  push:
    branches:
      - proyecto-04-cicd
  pull_request:
    branches:
      - proyecto-04-cicd
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and test microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and verify Auth
        working-directory: campusgo-auth
        run: ./mvnw -B clean verify

      - name: Build and verify Objetos
        working-directory: campusgo-objetos
        run: ./mvnw -B clean verify

  publish-images:
    name: Build and publish Docker images
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Auth
        uses: docker/build-push-action@v6
        with:
          context: ./campusgo-auth
          push: true
          tags: |
            ghcr.io/juanfandino21/campusgo-auth:latest
            ghcr.io/juanfandino21/campusgo-auth:sha-${{ github.sha }}

      - name: Build and push Objetos
        uses: docker/build-push-action@v6
        with:
          context: ./campusgo-objetos
          push: true
          tags: |
            ghcr.io/juanfandino21/campusgo-objetos:latest
            ghcr.io/juanfandino21/campusgo-objetos:sha-${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    needs: publish-images
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/proyecto-04-cicd'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Verify Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Update Auth deployment
        run: |
          kubectl set image deployment/campusgo-auth campusgo-auth=ghcr.io/juanfandino21/campusgo-auth:sha-${{ github.sha }} -n campusgo

      - name: Update Objetos deployment
        run: |
          kubectl set image deployment/campusgo-objetos campusgo-objetos=ghcr.io/juanfandino21/campusgo-objetos:sha-${{ github.sha }} -n campusgo

      - name: Verify Auth rollout
        run: |
          kubectl rollout status deployment/campusgo-auth -n campusgo --timeout=180s

      - name: Verify Objetos rollout
        run: |
          kubectl rollout status deployment/campusgo-objetos -n campusgo --timeout=180s
