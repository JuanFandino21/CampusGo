services:

  # ==========================================
  # Base de datos del microservicio de AUTH
  # ==========================================
  db-auth:
    image: postgres:16-alpine
    container_name: campusgo-db-auth

    environment:
      POSTGRES_DB: campusgo_auth
      POSTGRES_USER: campusgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - campusgo-auth-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgo -d campusgo_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================
  # Base de datos del microservicio de OBJETOS
  # ==========================================
  db-objetos:
    image: postgres:16-alpine
    container_name: campusgo-db-objetos

    environment:
      POSTGRES_DB: campusgo_objetos
      POSTGRES_USER: campusgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - campusgo-objetos-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgo -d campusgo_objetos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================
  # Microservicio de AUTENTICACIÓN
  # ==========================================
  auth:
    build:
      context: ./campusgo-auth
      dockerfile: Dockerfile

    image: campusgo-auth:1.0
    container_name: campusgo-auth

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:postgresql://db-auth:5432/campusgo_auth
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: campusgo
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_H2_CONSOLE_ENABLED: "false"

      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}

    depends_on:
      db-auth:
        condition: service_healthy


  # ==========================================
  # Microservicio de OBJETOS
  # ==========================================
  objetos:
    build:
      context: ./campusgo-objetos
      dockerfile: Dockerfile

    image: campusgo-objetos:1.0
    container_name: campusgo-objetos

    ports:
      - "8083:8083"

    environment:
      SERVER_PORT: 8083

      SPRING_DATASOURCE_URL: jdbc:postgresql://db-objetos:5432/campusgo_objetos
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: campusgo
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_H2_CONSOLE_ENABLED: "false"

    depends_on:
      db-objetos:
        condition: service_healthy


volumes:
  campusgo-auth-data:
  campusgo-objetos-data:
