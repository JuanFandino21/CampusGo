apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusgo-objetos
  namespace: campusgo
spec:
  replicas: 1

  selector:
    matchLabels:
      app: campusgo-objetos

  template:
    metadata:
      labels:
        app: campusgo-objetos

    spec:
      containers:
        - name: campusgo-objetos

          image: ghcr.io/juanfandino21/campusgo-objetos:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8083

          envFrom:
            - configMapRef:
                name: campusgo-objetos-config

          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campusgo-secret
                  key: POSTGRES_PASSWORD

          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
