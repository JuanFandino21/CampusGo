<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGo</title>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Lexend", sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background: #eef2f6;
            color: #1f3a5f;
        }

        hr { border: none; border-top: 2px dashed #b8c4d2; margin: 30px 0; }

        label { display: block; font-weight: 600; margin-bottom: 4px; }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #b8c4d2;
            border-radius: 8px;
            background: white;
            font: inherit;
            box-sizing: border-box;
        }

        button {
            background: #1f3a5f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font: inherit;
            cursor: pointer;
        }

        button:hover { background: #2d5282; }

        ul { list-style: none; padding: 0; }

        li {
            background: white;
            padding: 12px 16px;
            margin-top: 10px;
            border-radius: 8px;
            border-left: 6px solid gray;
        }

        .buscador { display: flex; gap: 8px; }
        .buscador input { flex: 1; }

        .PERDIDO { border-left-color: #d64545; }
        .ENCONTRADO { border-left-color: #2e8b57; }
    </style>
</head>

<body>

    <h1>CampusGo</h1>

    <h2>Objetos perdidos y encontrados</h2>

    <p>
        Plataforma universitaria para registrar y consultar
        objetos perdidos y encontrados.
    </p>

    <hr>

    <h3>Registrar objeto</h3>

    <form id="formularioObjeto">

        <label>Nombre:</label>
        <input type="text" id="nombre" required>
        <br><br>

        <label>Descripción:</label>
        <input type="text" id="descripcion" required>
        <br><br>

        <label>Categoría:</label>
        <input type="text" id="categoria" required>
        <br><br>

        <label>Ubicación:</label>
        <input type="text" id="ubicacion" required>
        <br><br>

        <label>Estado:</label>

        <select id="estado" required>
            <option value="PERDIDO">PERDIDO</option>
            <option value="ENCONTRADO">ENCONTRADO</option>
        </select>

        <br><br>

        <button type="submit">Registrar objeto</button>

    </form>

    <hr>

    <h3>Objetos registrados</h3>

    <label for="busqueda">Buscar por nombre:</label>

    <div class="buscador">
        <input type="text" id="busqueda" placeholder="Ej: calculadora">
        <button onclick="buscarObjetos()">Buscar</button>
        <button onclick="listarObjetos()">Ver todos</button>
    </div>

    <ul id="listaObjetos"></ul>

    <script>

        const formulario = document.getElementById("formularioObjeto");

        formulario.addEventListener("submit", function(evento) {

            evento.preventDefault();

            const objeto = {
                nombre: document.getElementById("nombre").value,
                descripcion: document.getElementById("descripcion").value,
                categoria: document.getElementById("categoria").value,
                ubicacion: document.getElementById("ubicacion").value,
                estado: document.getElementById("estado").value
            };

            fetch("/api/objetos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(objeto)
            })
            .then(function(respuesta) {

                if (!respuesta.ok) {
                    throw new Error("No se pudo registrar el objeto.");
                }

                return respuesta.json();
            })
            .then(function(objetoRegistrado) {

                alert("Objeto registrado correctamente.");

                formulario.reset();

                listarObjetos();
            })
            .catch(function(error) {

                alert(error.message);
            });
        });

        function buscarObjetos() {

            const texto = document.getElementById("busqueda").value;

            listarObjetos("/api/objetos/buscar?nombre=" + encodeURIComponent(texto));
        }

        function listarObjetos(url = "/api/objetos") {

            fetch(url)
            .then(function(respuesta) {
                return respuesta.json();
            })
            .then(function(objetos) {

                const lista = document.getElementById("listaObjetos");

                lista.innerHTML = "";

                if (objetos.length === 0) {
                    lista.innerHTML = "<li>No se encontraron objetos.</li>";
                }

                objetos.forEach(function(objeto) {

                    const elemento = document.createElement("li");

                    elemento.className = objeto.estado;

                    elemento.textContent =
                        objeto.nombre
                        + " - "
                        + objeto.estado
                        + " - "
                        + objeto.ubicacion;

                    lista.appendChild(elemento);
                });
            })
            .catch(function(error) {

                alert("No se pudieron cargar los objetos.");
            });
        }

        listarObjetos();

    </script>

</body>

</html>
